# pyproject.toml -- imagewright package configuration (PEP 621)
#
# Image generation for the fleet: an HTTP client, local image servers and an
# MCP tool. Nothing here depends on a knowledge graph.
#
# Author: Eric G. Suchanek, PhD
#
# Build system : Poetry 2.x with PEP 621 [project] table
#
# Extras are user-facing features; dev tooling is a Poetry group, so it never
# ships in the wheel and cannot be pip-installed. See FLEET_STANDARDS.md in
# kgrag_priv.
#
# Quick install (poetry)
# ----------------------
#   poetry install                      core runtime only
#   poetry install --with dev           + pytest, ruff, ty, pre-commit
#   poetry install -E flux -E openai    + in-process FLUX, OpenAI backend
#   poetry install -E serve -E flux     + `imagewright serve` (FLUX server)
#   poetry install -E serve -E sdxl     + `imagewright serve --backend sdxl`
#   poetry install -E mcp               + `imagewright-mcp`
#
# Run tests
# ---------
#   pytest

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "imagewright", from = "src" }]

# ---------------------------------------------------------------------------
# PEP 621 project metadata
# ---------------------------------------------------------------------------
[project]
name = "imagewright"
version = "0.2.0"
description = "Image generation over one HTTP contract: a client, local FLUX and SDXL servers, and an MCP tool"
readme = "README.md"
license = "Elastic-2.0"
authors = [
    { name = "Eric G. Suchanek, PhD", email = "suchanek@flux-frontiers.com" }
]
keywords = ["image-generation", "flux", "sdxl", "mflux", "diffusers", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.12,<3.14"
# Only what the client imports. Servers and model stacks are extras.
dependencies = [
    "click>=8.1.0,<9",
    "httpx>=0.27.0",
    "pillow>=13.0.0",
]

[project.optional-dependencies]
# In-process FLUX.2 Klein (Apple Silicon). 0.24.0 has the
# mflux.models.flux2.variants.txt2img.flux2_klein import path the client uses.
flux = ["mflux>=0.24.0"]
# OpenAI gpt-image-1 / DALL-E.
openai = ["openai>=1.30.0"]
# The HTTP servers behind `imagewright serve`. The FLUX server also needs
# `flux`; the SDXL server also needs `sdxl`. Floors from gutenberg_kg's
# docker/requirements-image.txt and requirements-sdxl.txt.
serve = ["fastapi>=0.116.0", "uvicorn>=0.30.0", "pydantic>=2.8.0"]
# SDXL-Lightning through diffusers (CUDA, MPS or CPU).
sdxl = [
    "torch>=2.4.0",
    "diffusers>=0.30.0",
    "transformers>=4.44.0",
    "accelerate>=0.33.0",
    "safetensors>=0.4.0",
    "huggingface_hub>=0.24.0",
]
# `imagewright-mcp` and as_mcp_image(). The fleet's MCP floor and cap.
mcp = ["mcp>=1.23.0,<2"]

[project.urls]
Homepage   = "https://github.com/Flux-Frontiers/imagewright"
Repository = "https://github.com/Flux-Frontiers/imagewright"
Issues     = "https://github.com/Flux-Frontiers/imagewright/issues"
Changelog  = "https://github.com/Flux-Frontiers/imagewright/blob/main/CHANGELOG.md"
Documentation = "https://flux-frontiers.github.io/imagewright/"

[project.scripts]
imagewright = "imagewright.cli:cli"
imagewright-mcp = "imagewright.mcp_server:main"

# ---------------------------------------------------------------------------
# Dev tooling (Poetry group, not a PEP 621 extra)
# ---------------------------------------------------------------------------
# `optional = true` keeps it out of a bare `poetry install`.
[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
detect-secrets = ">=1.5.0"
# The server and MCP stacks, so the tests drive the real FastAPI apps and MCP
# server without the `serve` or `mcp` extra. The model stacks (mflux, torch, diffusers) are never here.
fastapi = ">=0.116.0"
mcp = ">=1.23.0,<2"
pydantic = ">=2.8.0"
uvicorn = ">=0.30.0"
pre-commit = ">=4.5.1"
# >=9.0.3 is a security floor, not a preference: GHSA-6w46-j5rx-g56g.
pytest = ">=9.0.3"
pytest-cov = ">=5.0.0"
# Capped below 0.16 to match the rest of the fleet and the rev pinned in
# .pre-commit-config.yaml.
ruff = ">=0.15,<0.16"
# 0.0.97 renamed `unresolved-import` to `import-not-found`.
ty = ">=0.0.97"

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
# mkdocs is capped below 2: 2.0 removes the plugin system, and this site
# depends on two plugins (search, mkdocstrings).
mkdocs = ">=1.6,<2"
mkdocs-material = ">=9.5"
mkdocstrings = { version = ">=0.26", extras = ["python"] }

# ---------------------------------------------------------------------------
# Tool configuration
# ---------------------------------------------------------------------------
[tool.ruff]
line-length    = 100
target-version = "py312"
# Keep prose docs out of ruff 0.16's Markdown code-block formatting.
exclude = [".claude", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B023", "BLE001", "PLC0415"]
ignore = ["E501"]

[tool.ty.environment]
python-version = "3.12"
root = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v --tb=short --strict-markers"

[tool.coverage.run]
source = ["imagewright"]

[tool.coverage.report]
# A floor against regression, not a target. Checked by `pytest --cov` in CI
# and in the pre-commit pytest hook; raise it as coverage grows.
fail_under = 90

# ---------------------------------------------------------------------------
# KG index configuration (dockg / pycodekg are global tools)
# ---------------------------------------------------------------------------
[tool.pycodekg]
# Tests skew architectural metrics (fan-in, public API surface, docstring coverage).
exclude = ["tests"]
include = ["src"]

[tool.dockg]
exclude = ["__pycache__", "dist", "src", "tests"]
