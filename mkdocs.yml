site_name: imagewright
site_description: Image generation over one HTTP contract -- a client, local FLUX.2 Klein and SDXL-Lightning servers, an in-process mode and an MCP tool.
site_url: https://flux-frontiers.github.io/imagewright/
repo_url: https://github.com/Flux-Frontiers/imagewright
repo_name: Flux-Frontiers/imagewright
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/favicon.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.top
    - content.code.copy
    - content.action.edit

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: sphinx
            show_source: true
            show_root_heading: true
            heading_level: 2
            merge_init_into_class: true

nav:
  - Home: index.md
  - Getting started:
      - Install and render an image: getting-started.md
      - Choose a backend: backends.md
  - Servers:
      - Run an image server: servers.md
      - The HTTP contract: http-contract.md
  - CLI reference:
      - Every imagewright command: cli.md
  - Agents:
      - MCP server: mcp.md
  - API reference:
      - Client: api/client.md
      - Configuration: api/config.md
      - Discovery and backend selection: api/discovery.md
      - FLUX server: api/flux_server.md
      - SDXL server: api/sdxl_server.md
      - MCP image helper: api/mcp_image.md
      - launchd service: api/service.md
